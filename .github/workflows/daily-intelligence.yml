name: Daily Intelligence Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  run-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Evidence-first pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_NEW_ITEMS: "6"
          CLUSTER_MAX_ITEMS: "20"
          BRIEF_MAX_EVENTS: "6"
          ARTICLE_CHAR_LIMIT: "20000"
          INDEX_MAX_LINKS: "30"
        run: python src/main.py --mode daily

      - name: Commit updated intelligence
        run: |
          git config user.name "personal-intelligence-bot"
          git config user.email "personal-intelligence-bot@users.noreply.github.com"
          git add data/
          git commit -m "update evidence-first intelligence" || echo "No changes"
          git push
