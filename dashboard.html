<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Personal Intelligence Dashboard V0.6.3</title>
<style>
body{margin:0;background:#f6f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
.container{max-width:1200px;margin:30px auto;padding:0 24px}
h1{font-size:32px;margin-bottom:8px}
.subtitle{color:#6b7280;margin-bottom:28px}
.section{margin-top:32px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.domain{font-size:13px;color:#2563eb;margin-bottom:10px}
.title{font-size:18px;font-weight:700;margin-bottom:12px}
.text{line-height:1.6;color:#374151}
.meta{font-size:13px;color:#6b7280;margin-top:15px}
button{margin-top:15px;border:0;background:#2563eb;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
table{width:100%;background:white;border-collapse:collapse;border-radius:12px;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<div class="container">
<h1>Personal Intelligence Dashboard V0.6.3</h1>
<div class="subtitle">从信息流 → 判断 → 深入阅读的个人情报入口（Alpha）</div>

<div class="section">
<h2>今日值得关注</h2>
<div id="top" class="cards"></div>
</div>

<div class="section">
<h2>我的关注领域</h2>
<div id="domains" class="cards"></div>
</div>

<div class="section">
<h2>最新收录</h2>
<table>
<thead><tr><th>时间</th><th>标题</th><th>领域</th><th>来源</th></tr></thead>
<tbody id="latest"></tbody>
</table>
</div>
</div>

<script>
async function load(){
try{
const items=await fetch("data/items.json").then(r=>r.json());
const sorted=items.slice().reverse();
const top=sorted.slice(0,5);

document.getElementById("top").innerHTML=top.map(x=>{
const a=x.analysis||{};
return `<div class="card">
<div class="domain">${a.knowledge_domain||"未分类"}</div>
<div class="title">${a.title_zh||x.title_original}</div>
<div class="text"><b>为什么值得看：</b>${a.why_it_matters||""}</div>
<div class="meta">来源：${x.source_name||""}</div>
<button onclick="window.open('${x.url||"#"}')">查看原文</button>
</div>`;
}).join("");

const domains=[...new Set(sorted.map(x=>x.analysis?.knowledge_domain).filter(Boolean))];
document.getElementById("domains").innerHTML=domains.map(d=>{
const arr=sorted.filter(x=>x.analysis?.knowledge_domain===d).slice(0,3);
return `<div class="card"><div class="title">${d}</div>${arr.map(x=>`<div class="text">• ${x.analysis?.title_zh||x.title_original}</div>`).join("")}</div>`;
}).join("");

document.getElementById("latest").innerHTML=sorted.slice(0,20).map(x=>{
return `<tr><td>${x.processed_at_utc?.slice(0,10)||""}</td><td>${x.analysis?.title_zh||x.title_original}</td><td>${x.analysis?.knowledge_domain||""}</td><td>${x.source_name||""}</td></tr>`;
}).join("");
}catch(e){
document.body.innerHTML+="<p>无法读取 data/items.json，请确认dashboard.html与data目录路径关系。</p>";
}
}
load();
</script>
</body>
</html>
